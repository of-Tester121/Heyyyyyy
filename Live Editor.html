<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Live Editor</title>
<style>
:root{
  --bg:#ffffff;--panel:#f4f4f5;--text:#18181b;--muted:#71717a;--border:#d4d4d8;--accent:#2563eb;--accent-text:#ffffff;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#18181b;--panel:#27272a;--text:#f4f4f5;--muted:#a1a1aa;--border:#3f3f46;--accent:#3b82f6;--accent-text:#ffffff;color-scheme:dark;}
}
:root[data-theme="dark"]{--bg:#18181b;--panel:#27272a;--text:#f4f4f5;--muted:#a1a1aa;--border:#3f3f46;--accent:#3b82f6;--accent-text:#ffffff;color-scheme:dark;}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--panel)}
h1{font-size:16px;margin:0}
button{font:inherit;cursor:pointer;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text);padding:6px 12px}
button.live{background:var(--accent);color:var(--accent-text);border-color:var(--accent);font-weight:600}
.tabs{display:flex;gap:4px;padding:8px 14px 0;border-bottom:1px solid var(--border)}
.tab{border-radius:6px 6px 0 0;border-bottom:none;color:var(--muted)}
.tab.active{background:var(--panel);color:var(--text);font-weight:600}
main{flex:1;min-height:0;display:flex}
textarea{flex:1;width:100%;border:none;resize:none;outline:none;padding:14px;background:var(--panel);color:var(--text);font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;line-height:1.5;tab-size:2;display:none;box-sizing:border-box}
textarea.active{display:block}
footer{padding:6px 14px;font-size:12px;color:var(--muted);border-top:1px solid var(--border)}
</style>
</head>
<body>
<header>
  <h1>Live Editor</h1>
  <div><button id="clear">Clear</button> <button id="live" class="live">Live ▶</button></div>
</header>
<div class="tabs">
  <button class="tab active" data-t="html">HTML</button>
  <button class="tab" data-t="css">CSS</button>
  <button class="tab" data-t="js">JS</button>
</div>
<main>
  <textarea id="html" class="active" spellcheck="false"></textarea>
  <textarea id="css" spellcheck="false"></textarea>
  <textarea id="js" spellcheck="false"></textarea>
</main>
<footer>Put your code in the tabs, then hit Live to open it in a new tab. Ctrl/Cmd+Enter works too.</footer>

<script>
var KEY = "live-editor-v1";
var ids = ["html", "css", "js"];
var defaults = {
  html: "<h1>Hello!</h1>\n<button id=\"btn\">Click me</button>",
  css: "body {\n  font-family: sans-serif;\n  text-align: center;\n  padding: 40px;\n}",
  js: "document.getElementById('btn').onclick = function () {\n  alert('It works!');\n};"
};
var el = {};
ids.forEach(function (i) { el[i] = document.getElementById(i); });

function load() {
  var saved = null;
  try { saved = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
  ids.forEach(function (i) { el[i].value = (saved && typeof saved[i] === "string") ? saved[i] : defaults[i]; });
}
function save() {
  try {
    var o = {};
    ids.forEach(function (i) { o[i] = el[i].value; });
    localStorage.setItem(KEY, JSON.stringify(o));
  } catch (e) {}
}
ids.forEach(function (i) { el[i].addEventListener("input", save); });

document.querySelectorAll(".tab").forEach(function (b) {
  b.addEventListener("click", function () {
    document.querySelectorAll(".tab").forEach(function (x) { x.classList.toggle("active", x === b); });
    ids.forEach(function (i) { el[i].classList.toggle("active", i === b.dataset.t); });
    el[b.dataset.t].focus();
  });
});

ids.forEach(function (i) {
  el[i].addEventListener("keydown", function (e) {
    if (e.key === "Tab") {
      e.preventDefault();
      var s = this.selectionStart;
      this.value = this.value.slice(0, s) + "  " + this.value.slice(this.selectionEnd);
      this.selectionStart = this.selectionEnd = s + 2;
      save();
    }
  });
});

function build() {
  var code = el.js.value.replace(/<\/script/gi, "<\\/script");
  return "<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Live Preview</title>\n<style>\n" +
    el.css.value + "\n</style>\n</head>\n<body>\n" + el.html.value + "\n<script>\n" + code + "\n<\/script>\n</body>\n</html>";
}

function goLive() {
  var doc = build();
  var w = window.open("", "_blank");
  if (w) {
    try { w.document.open(); w.document.write(doc); w.document.close(); return; } catch (e) {}
    try { w.close(); } catch (e2) {}
  }
  try {
    var url = URL.createObjectURL(new Blob([doc], { type: "text/html" }));
    var w2 = window.open(url, "_blank");
    if (w2) return;
  } catch (e3) {}
  alert("Your browser blocked the new tab. Allow pop-ups for this page and try again.");
}

document.getElementById("live").addEventListener("click", goLive);
document.getElementById("clear").addEventListener("click", function () {
  if (confirm("Clear all three tabs?")) { ids.forEach(function (i) { el[i].value = ""; }); save(); }
});
document.addEventListener("keydown", function (e) {
  if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); goLive(); }
});
load();
</script>
</body>
</html>
